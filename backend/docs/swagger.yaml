basePath: /
definitions:
  internal_api_handlers.LoginRequest:
    properties:
      password:
        example: admin123
        type: string
      username:
        example: tsadmin
        type: string
    required:
    - password
    - username
    type: object
host: localhost:8080
info:
  contact:
    email: ts.communicationmagura@gmail.com
    name: TS Communication
  description: Enterprise ISP Billing & Network Management System
  license:
    name: MIT
  title: TS Cloud ISP Billing API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login using username and password
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: User Login
      tags:
      - Authentication
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
